<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#15171B" stroke-opacity=".035" stroke-width="1"/>
    </pattern>
    <pattern id="mini-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1F3158" stroke-opacity=".05" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="22" stdDeviation="28" flood-color="#1E2534" flood-opacity=".13"/>
    </filter>
    <filter id="button-shadow" x="-20%" y="-30%" width="140%" height="180%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#FF4D3D" flood-opacity=".23"/>
    </filter>
    <style>
      text { font-family: "PingFang SC", "Microsoft YaHei", sans-serif; letter-spacing: 0; }
      .ink { fill: #15171B; }
      .muted { fill: #6F7782; }
      .coral { fill: #FF4D3D; }
      .mint { fill: #20B99A; }
      .small { font-size: 12px; }
      .body { font-size: 14px; }
      .label { font-size: 13px; font-weight: 600; }
      .strong { font-weight: 700; }
      .heavy { font-weight: 800; }
    </style>
  </defs>

  <rect width="1440" height="900" fill="#F7F8FA"/>
  <rect width="1440" height="900" fill="url(#grid)"/>

  <g id="Header">
    <rect x="0" y="0" width="1440" height="76" fill="#FFFFFF" fill-opacity=".86"/>
    <line x1="64" y1="75.5" x2="1376" y2="75.5" stroke="#15171B" stroke-opacity=".1"/>
    <g id="Logo" transform="translate(68 19)">
      <path d="M0 4C0 1.8 1.8 0 4 0H17V7H7V17H0V4Z" fill="#FF4D3D"/>
      <path d="M0 37V24H7V34H17V41H4C1.8 41 0 39.2 0 37Z" fill="#FF4D3D"/>
      <rect x="13" y="7" width="26" height="27" rx="4" fill="#15171B"/>
      <text x="26" y="27" text-anchor="middle" fill="#FFFFFF" font-size="18" font-weight="800">B</text>
      <text x="51" y="20" class="ink heavy" font-size="23">巴布</text>
      <text x="51" y="37" class="muted" font-size="9">自媒体运营助理</text>
    </g>
    <g transform="translate(1151 29)">
      <circle cx="4" cy="4" r="4" fill="#20B99A"/>
      <circle cx="4" cy="4" r="9" fill="#20B99A" fill-opacity=".12"/>
      <text x="20" y="9" class="muted label">从账号开始，把内容做出来</text>
    </g>
  </g>

  <g id="Hero">
    <g id="HeroCopy" transform="translate(80 174)">
      <rect x="0" y="0" width="224" height="36" rx="2" fill="#FFFFFF" fill-opacity=".78"/>
      <rect x="0" y="0" width="3" height="36" fill="#FF4D3D"/>
      <text x="16" y="23" fill="#4F5660" font-size="15" font-weight="700">给品牌主、小团队和个人 IP</text>

      <text x="0" y="116" class="coral heavy" font-size="72">巴布，</text>
      <text x="0" y="194" class="ink heavy" font-size="60">你的自媒体运营助理</text>

      <text x="0" y="252" fill="#4F5660" font-size="19">录入账号和资料，整理账号定位和内容方向</text>
      <text x="0" y="286" fill="#4F5660" font-size="19">生成可发布的小红书笔记和图片</text>

      <g id="PrimaryButton" transform="translate(0 330)" filter="url(#button-shadow)">
        <rect width="210" height="58" rx="6" fill="#FF4D3D"/>
        <text x="28" y="36" fill="#FFFFFF" font-size="18" font-weight="700">立即开始</text>
        <path d="M162 29H183M176 22L183 29L176 36" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </g>

      <g transform="translate(0 427)">
        <rect x="0" y="7" width="30" height="2" fill="#20B99A"/>
        <text x="44" y="13" class="muted" font-size="13">不是从空白对话开始，而是沿着你的账号持续创作</text>
      </g>
    </g>

    <g id="ProductWorkflow" transform="translate(650 124)" filter="url(#shadow)">
      <rect width="710" height="500" rx="14" fill="#FFFFFF"/>
      <rect x=".5" y=".5" width="709" height="499" rx="13.5" fill="none" stroke="#15171B" stroke-opacity=".13"/>
      <rect width="710" height="500" rx="14" fill="url(#mini-grid)"/>

      <g id="VisualTopbar">
        <text x="28" y="31" class="muted small">当前账号</text>
        <text x="95" y="32" class="ink strong" font-size="17">爪边生活</text>
        <rect x="598" y="17" width="84" height="28" rx="14" fill="#EAF8F4" stroke="#BFE9DE"/>
        <text x="640" y="35" text-anchor="middle" fill="#15836E" font-size="11" font-weight="700">资料已就绪</text>
        <line x1="28" y1="62" x2="682" y2="62" stroke="#DFE3E8"/>
      </g>

      <g id="AccountSource" transform="translate(28 90)">
        <rect width="224" height="282" rx="10" fill="#FFFFFF" fill-opacity=".9" stroke="#DFE3E8"/>
        <rect x="18" y="20" width="44" height="44" rx="10" fill="#15171B"/>
        <text x="40" y="48" text-anchor="middle" fill="#FFFFFF" font-size="15" font-weight="800">爪</text>
        <text x="76" y="36" class="ink strong" font-size="14">账号与产品资料</text>
        <text x="76" y="56" class="muted" font-size="11">品牌 · 宠物用品</text>

        <text x="18" y="100" fill="#858C95" font-size="10">目标用户</text>
        <text x="18" y="122" fill="#30353C" font-size="13" font-weight="700">新手养猫家庭</text>
        <line x1="18" y1="140" x2="206" y2="140" stroke="#EBEDF0"/>

        <text x="18" y="170" fill="#858C95" font-size="10">内容目标</text>
        <text x="18" y="192" fill="#30353C" font-size="13" font-weight="700">建立信任与认知</text>
        <line x1="18" y1="210" x2="206" y2="210" stroke="#EBEDF0"/>

        <text x="18" y="240" fill="#858C95" font-size="10">主推商品</text>
        <text x="18" y="262" fill="#30353C" font-size="13" font-weight="700">可水洗宠物餐垫</text>
      </g>

      <g id="ProcessCore" transform="translate(271 145)">
        <rect width="140" height="172" rx="10" fill="#15171B"/>
        <rect x="51" y="20" width="38" height="38" rx="8" fill="#FF4D3D"/>
        <text x="70" y="46" text-anchor="middle" fill="#FFFFFF" font-size="17" font-weight="800">B</text>
        <text x="70" y="86" text-anchor="middle" fill="#B9BEC6" font-size="10">巴布正在整理</text>
        <text x="70" y="110" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="700">定位与内容方向</text>
        <rect x="22" y="135" width="96" height="4" rx="2" fill="#FFFFFF" fill-opacity=".18"/>
        <rect x="22" y="135" width="66" height="4" rx="2" fill="#20B99A"/>
      </g>

      <g id="ContentOutput" transform="translate(430 90)">
        <rect width="252" height="282" rx="10" fill="#FFFFFF" fill-opacity=".9" stroke="#DFE3E8"/>
        <text x="18" y="28" class="muted" font-size="10">这周可以写什么</text>
        <text x="18" y="51" class="ink strong" font-size="14">3 条内容主线</text>

        <g transform="translate(14 68)">
          <rect width="224" height="58" rx="8" fill="#FFF0ED" stroke="#FFB8B0"/>
          <rect x="12" y="14" width="28" height="28" rx="7" fill="#FF4D3D"/>
          <text x="26" y="33" text-anchor="middle" fill="#FFFFFF" font-size="10" font-weight="700">01</text>
          <text x="52" y="25" class="ink strong" font-size="12">新手养猫避坑</text>
          <text x="52" y="44" class="muted" font-size="10">痛点场景 · 解决办法</text>
        </g>

        <g transform="translate(14 136)">
          <rect width="224" height="52" rx="8" fill="#FFFFFF" stroke="#E4E7EB"/>
          <text x="20" y="31" fill="#7A818A" font-size="10" font-weight="700">02</text>
          <text x="52" y="23" class="ink strong" font-size="12">用品真实测评</text>
          <text x="52" y="40" class="muted" font-size="10">真实体验 · 对比</text>
        </g>

        <g transform="translate(14 198)">
          <rect width="224" height="52" rx="8" fill="#FFFFFF" stroke="#E4E7EB"/>
          <text x="20" y="31" fill="#7A818A" font-size="10" font-weight="700">03</text>
          <text x="52" y="23" class="ink strong" font-size="12">日常清洁记录</text>
          <text x="52" y="40" class="muted" font-size="10">使用场景 · 轻分享</text>
        </g>
      </g>

      <g id="Result" transform="translate(28 398)">
        <rect width="654" height="72" rx="10" fill="#F4F7FB" stroke="#DCE2EA"/>
        <rect width="4" height="72" rx="2" fill="#20B99A"/>
        <text x="20" y="27" class="muted" font-size="10">今日内容建议</text>
        <text x="20" y="51" class="ink strong" font-size="14">猫碗旁边总是脏？先别急着换碗</text>
        <g transform="translate(432 23)">
          <rect width="42" height="26" rx="13" fill="#FFFFFF" stroke="#DDE2E7"/>
          <text x="21" y="17" text-anchor="middle" class="muted" font-size="10">标题</text>
          <rect x="48" width="42" height="26" rx="13" fill="#FFFFFF" stroke="#DDE2E7"/>
          <text x="69" y="17" text-anchor="middle" class="muted" font-size="10">正文</text>
          <rect x="96" width="42" height="26" rx="13" fill="#FFFFFF" stroke="#DDE2E7"/>
          <text x="117" y="17" text-anchor="middle" class="muted" font-size="10">话题</text>
          <rect x="144" width="58" height="26" rx="13" fill="#FFF0ED" stroke="#FFB8B0"/>
          <text x="173" y="17" text-anchor="middle" fill="#D43D31" font-size="10">图片方案</text>
        </g>
      </g>
    </g>
  </g>

  <g id="Capabilities" transform="translate(80 690)">
    <rect width="1280" height="150" rx="8" fill="#FFFFFF" fill-opacity=".9" stroke="#DDE1E6"/>
    <rect x="0" y="0" width="1280" height="4" rx="2" fill="#15171B"/>

    <g transform="translate(0 0)">
      <circle cx="48" cy="48" r="19" fill="#FFF0ED"/>
      <circle cx="48" cy="44" r="7" fill="none" stroke="#FF4D3D" stroke-width="2"/>
      <path d="M36 61C39 52 57 52 60 61" fill="none" stroke="#FF4D3D" stroke-width="2" stroke-linecap="round"/>
      <text x="82" y="42" class="ink strong" font-size="16">账号定位解析</text>
      <text x="82" y="65" class="muted" font-size="12">理清用户与内容方向</text>
      <rect x="82" y="86" width="72" height="23" rx="11.5" fill="#FFF0ED"/>
      <text x="118" y="102" text-anchor="middle" fill="#D43D31" font-size="10">定位与人设</text>
    </g>
    <line x1="256" y1="28" x2="256" y2="122" stroke="#DFE3E8"/>

    <g transform="translate(256 0)">
      <circle cx="48" cy="48" r="19" fill="#EAF8F4"/>
      <circle cx="48" cy="48" r="11" fill="none" stroke="#20B99A" stroke-width="2"/>
      <circle cx="48" cy="48" r="4" fill="#20B99A"/>
      <path d="M59 37L67 29M62 29H67V34" fill="none" stroke="#20B99A" stroke-width="2" stroke-linecap="round"/>
      <text x="82" y="42" class="ink strong" font-size="16">对标账号拆解</text>
      <text x="82" y="65" class="muted" font-size="12">找到值得借鉴的方法</text>
      <rect x="82" y="86" width="72" height="23" rx="11.5" fill="#EAF8F4"/>
      <text x="118" y="102" text-anchor="middle" fill="#15836E" font-size="10">拆解与差异</text>
    </g>
    <line x1="512" y1="28" x2="512" y2="122" stroke="#DFE3E8"/>

    <g transform="translate(512 0)">
      <circle cx="48" cy="48" r="19" fill="#EEF2FA"/>
      <circle cx="45" cy="45" r="9" fill="none" stroke="#1F3158" stroke-width="2"/>
      <path d="M52 52L61 61" fill="none" stroke="#1F3158" stroke-width="2" stroke-linecap="round"/>
      <text x="82" y="42" class="ink strong" font-size="16">内容搜索</text>
      <text x="82" y="65" class="muted" font-size="12">找到可以继续写的线索</text>
      <rect x="82" y="86" width="72" height="23" rx="11.5" fill="#EEF2FA"/>
      <text x="118" y="102" text-anchor="middle" fill="#1F3158" font-size="10">选题与参考</text>
    </g>
    <line x1="768" y1="28" x2="768" y2="122" stroke="#DFE3E8"/>

    <g transform="translate(768 0)">
      <circle cx="48" cy="48" r="19" fill="#FFF5E7"/>
      <path d="M40 37H54V55H40Z" fill="none" stroke="#D18A22" stroke-width="2"/>
      <path d="M51 52L61 42L65 46L55 56L50 57Z" fill="#FFF5E7" stroke="#D18A22" stroke-width="2" stroke-linejoin="round"/>
      <text x="82" y="42" class="ink strong" font-size="16">文案生成</text>
      <text x="82" y="65" class="muted" font-size="12">生成标题、正文和话题</text>
      <rect x="82" y="86" width="72" height="23" rx="11.5" fill="#FFF5E7"/>
      <text x="118" y="102" text-anchor="middle" fill="#A86B17" font-size="10">可修改笔记</text>
    </g>
    <line x1="1024" y1="28" x2="1024" y2="122" stroke="#DFE3E8"/>

    <g transform="translate(1024 0)">
      <circle cx="48" cy="48" r="19" fill="#F1EDFF"/>
      <rect x="38" y="38" width="20" height="18" rx="2" fill="none" stroke="#6746C7" stroke-width="2"/>
      <circle cx="53" cy="43" r="2" fill="#6746C7"/>
      <path d="M40 53L46 47L51 52L55 49L59 54" fill="none" stroke="#6746C7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="82" y="42" class="ink strong" font-size="16">图片生成</text>
      <text x="82" y="65" class="muted" font-size="12">生成配图与封面方案</text>
      <rect x="82" y="86" width="72" height="23" rx="11.5" fill="#F1EDFF"/>
      <text x="118" y="102" text-anchor="middle" fill="#6746C7" font-size="10">配图与封面</text>
    </g>
  </g>
</svg>
